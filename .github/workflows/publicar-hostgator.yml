# Publica la tienda en HostGator por FTP en cada cambio de la rama.
#
# Configuración (una sola vez) en GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER    p. ej. ftp.ciutat.com (o el servidor de cPanel, gator3300.hostgator.com)
#              FTP_USERNAME  usuario FTP (el de cPanel o una cuenta FTP creada para la tienda)
#              FTP_PASSWORD  contraseña de ese usuario
#   FTP_DIR (como variable o como secret): carpeta de la tienda vista desde ese usuario
#                            FTP, terminada en / (cuenta principal de cPanel: public_html/ciutat.com/bike/)
#   SITE_URL (variable, opcional): URL pública de la tienda terminada en /, para comprobar
#                            tras publicar que la versión nueva está en marcha.
#
# Nunca se suben ni se borran en el servidor: config.php, uploads/, storage/ ni install.php.
name: Publicar en HostGator

on:
  push:
    branches: [claude/bike-shop-store-t9abnp, main]
  workflow_dispatch:

concurrency:
  group: publicar-hostgator
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar configuración
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || secrets.FTP_DIR }}
          FTP_DIR_VAR: ${{ vars.FTP_DIR }}
          FTP_DIR_SECRET: ${{ secrets.FTP_DIR }}
        run: |
          # FTP_DIR puede estar como variable (se muestra) o como secret (se oculta)
          if [ -n "$FTP_DIR_VAR" ] && [ -n "$FTP_DIR_SECRET" ] && [ "$FTP_DIR_VAR" != "$FTP_DIR_SECRET" ]; then
            echo "::error::Hay dos FTP_DIR distintos: uno en Variables ($FTP_DIR_VAR) y otro en Secrets. Borra uno de los dos y deja el correcto."
            exit 1
          fi
          if [ -n "$FTP_DIR_VAR" ]; then echo "FTP_DIR (variable): $FTP_DIR_VAR"; elif [ -n "$FTP_DIR_SECRET" ]; then echo "FTP_DIR: se lee del secret"; fi
          missing=""
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_DIR; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            # Sin ningún dato configurado (p. ej. un fork) no se publica, sin error
            if [ "$missing" = " FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_DIR" ]; then
              echo "::warning::Publicación no configurada. No se publica."
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Falta configurar:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          case "$FTP_DIR" in */) ;; *) echo "::error::FTP_DIR debe terminar en /"; exit 1;; esac
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - name: PHP y dependencias de producción
        if: steps.cfg.outputs.ok == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: composer install
        if: steps.cfg.outputs.ok == 'true'
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Comprobar sintaxis PHP
        if: steps.cfg.outputs.ok == 'true'
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Marca de versión
        if: steps.cfg.outputs.ok == 'true'
        run: echo "$GITHUB_SHA" > version.txt

      - name: Subir por FTP (solo archivos cambiados)
        if: steps.cfg.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_DIR || secrets.FTP_DIR }}
          protocol: ftps
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config.php
            install.php
            uploads/**
            storage/**
            bin/empaquetar.sh
            README.md
            PUBLICAR-HOSTGATOR.md
            vendor/**/tests/**

      - name: Comprobar la web publicada
        if: steps.cfg.outputs.ok == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.ciutat.com/bike/' }}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          origin=$(echo "$SITE_URL" | grep -oE '^https?://[^/]+')
          sleep 5
          live=$(curl -sSL -m 30 -A "$UA" "${SITE_URL}version.txt?t=$(date +%s)" | head -c 80)
          echo "Versión publicada: $GITHUB_SHA"
          echo "version.txt en la web: $live"
          code=$(curl -sSL -m 30 -A "$UA" -o page.html -w '%{http_code}' "$SITE_URL")
          echo "Portada: HTTP $code"
          echo "Archivos estáticos que pide la portada:"
          grep -oE '(href|src)="[^"]*assets/[^"]*"' page.html | sort -u | head -5 || true
          css=$(grep -oE 'href="[^"]*style\.css[^"]*"' page.html | head -1 | cut -d'"' -f2)
          case "$css" in http*) ;; /*) css="$origin$css" ;; ?*) css="$SITE_URL$css" ;; esac
          csscode=$( [ -n "$css" ] && curl -s -m 30 -A "$UA" -o /dev/null -w '%{http_code}' "$css" || echo "sin CSS")
          echo "CSS ($css): $csscode"
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "Buscando dónde ha quedado version.txt (diagnóstico):"
            for u in "https://huma.bike/" "http://huma.bike/" "https://www.huma.bike/" "https://www.ciutat.com/" "https://ciutat.com/bike/" \
                     "${SITE_URL}public_html/ciutat.com/bike/" "https://huma.bike/public_html/ciutat.com/bike/" "https://www.ciutat.com/ciutat.com/bike/"; do
              v=$(curl -sL -m 15 -A "$UA" "${u}version.txt?t=$(date +%s)" | head -c 40)
              [ "$v" = "$GITHUB_SHA" ] && echo "  ✔ ENCONTRADO en ${u}version.txt" || echo "  ✘ ${u}version.txt"
            done
            echo "Redirecciones de huma.bike:"
            curl -sI -m 15 -A "$UA" https://huma.bike/ | grep -iE '^(HTTP|location)' || true
            curl -sI -m 15 -A "$UA" http://huma.bike/ | grep -iE '^(HTTP|location)' || true
            echo "::error::La web no muestra la versión recién subida: los archivos no están llegando a la carpeta de la tienda. Revisa FTP_DIR."
            exit 1
          fi
          if [ "$code" != "200" ] || [ "$csscode" != "200" ]; then
            echo "::error::La versión nueva está subida, pero la portada (HTTP $code) o su CSS ($csscode) no cargan bien."
            exit 1
          fi
          echo "✔ Web publicada y funcionando con la versión $GITHUB_SHA"
